version: "3.9"

services:
  stealthsearch:
    build: .
    image: stealthsearch:latest
    container_name: stealthsearch
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # The DB file lives inside the volume; TTL, delays and quarantines are
      # tunable here too (see app/config.py for the full variable list).
      CACHE_DB_PATH: /app/data/cache.db
      HEADLESS: "true"
      THROTTLE_MIN_DELAY: ${THROTTLE_MIN_DELAY:-15}
      THROTTLE_MAX_DELAY: ${THROTTLE_MAX_DELAY:-30}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s