[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muninn"
version = "0.1.0"
description = "Self-hosted web search and page-scraping gateway with an isolated stealth-browser render pool"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Levent Kurt" }]
keywords = ["search", "scraping", "playwright", "fastapi", "stealth-browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/reachdevel/Muninn"
Issues = "https://github.com/reachdevel/Muninn/issues"

# ---------------------------------------------------------------------------
# Tooling configuration (single source of truth for lint / types / tests).
# ---------------------------------------------------------------------------

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.setuptools]
packages = [
    "app",
    "browser_pool",
    "drivers",
    "fetchers",
    "ops",
    "parsers",
    "routers",
    "schemas",
    "services",
]

# The Playwright *package* pin lives in requirements.txt. This is the matching
# browser revision, so `make browsers` installs a reproducible Chromium.
[tool.muninn.playwright]
browser_revision = "chromium-1243"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return simplification
    "PTH",  # pathlib
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends()/Query() in defaults is idiomatic
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
# Tests may use long fixture strings and private helpers freely.
"tests/*" = ["E402", "F401", "B011"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "browser_pool",
    "drivers",
    "fetchers",
    "ops",
    "parsers",
    "routers",
    "schemas",
    "services",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
pretty = true
# Third-party stubs are not shipped; keep third-party imports lenient and hold
# our own code to the strict settings above.
[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "playwright_stealth.*",
    "trafilatura.*",
    "bs4.*",
    "aiosqlite.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make `pytest` work when invoked as a bare binary, not just `python -m pytest`.
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
