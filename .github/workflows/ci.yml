name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      # Formatting is available via `make format` but is deliberately not a CI
      # gate: enforcing it would mean reformatting the whole pre-existing
      # codebase in a single change, which obscures real review diffs.

      - name: mypy (types)
        run: mypy app browser_pool drivers fetchers ops parsers routers schemas services

      - name: Tests
        run: pytest

  matrix:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the current default.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: pytest

  docker:
    name: Container image builds and is healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: muninn:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose config is valid
        run: docker compose config -q

      # The image ships no curl, so this also proves the interpreter-based
      # healthcheck works in a minimal container.
      - name: Image healthcheck passes
        run: |
          docker run -d --name muninn-ci -p 8010:9999 muninn:ci
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' muninn-ci)
            echo "health: $state"
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs muninn-ci; exit 1; }
            sleep 5
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' muninn-ci)" = "healthy" ]
          # The published port must not be world-reachable by default.
          docker run --rm muninn:ci id -u | grep -qv '^0$' || {
            echo "container runs as root"; exit 1; }
        finally: docker rm -f muninn-ci || true

      - name: Container logs
        if: always()
        run: docker logs muninn-ci || true
